appId: dev.termspace.app
productName: Termspace
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
# node-pty is native and cannot be bundled, so it stays outside the asar.
# Without this the module loads in dev and fails only in the packaged app.
asarUnpack:
  - node_modules/node-pty/**/*
linux:
  target:
    - AppImage
  # Ties the window to the launcher entry; without it the dock shows two icons.
  syncDesktopName: true
  category: System
  synopsis: A horizontal-canvas terminal emulator
  description: >
    A terminal emulator that lays panes out on a horizontal canvas wider than
    the viewport. Panes past the window edge are not lost — they stay where you
    put them, and the arrow keys slide the viewport over to them.
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.developer-tools
  # No identity configured: electron-builder ad-hoc signs, which is what the
  # Apple Silicon kernel requires. Notarization is deliberately absent.
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish (e.g. v1.1.0)'
        required: true

# Native node-pty links against the build host's glibc, so build on the oldest
# runner still supported — a 24.04 build refuses to start on 22.04 desktops.
jobs:
  appimage:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Check the tag matches package.json
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          node - "$TAG" <<'NODE'
          const fs = require('node:fs')
          const tag = process.argv[2] ?? ''
          const semver =
            /^v(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-(?:(?:0|[1-9]\d*)|(?:[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))(?:\.(?:(?:0|[1-9]\d*)|(?:[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)))*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/
          if (!semver.test(tag)) {
            console.error(`Tag must be a v-prefixed SemVer release tag: ${tag}`)
            process.exit(1)
          }
          const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version
          if (tag !== `v${version}`) {
            console.error(`Tag ${tag} does not match package.json version ${version}`)
            process.exit(1)
          }
          NODE

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run dist

      - name: Checksum
        working-directory: release
        run: sha256sum *.AppImage > SHA256SUMS.txt

      # A SemVer prerelease tag (v1.1.0-beta.0) publishes as a GitHub
      # pre-release. Whichever platform job gets there first creates the
      # release, so both must agree on the flag.
      - name: Publish
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version_without_build=${TAG%%+*}
          release_args=()
          case "$version_without_build" in *-*) release_args+=(--prerelease) ;; esac
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes "${release_args[@]}" \
            || gh release view "$TAG" >/dev/null 2>&1
          gh release upload "$TAG" release/*.AppImage release/SHA256SUMS.txt --clobber

  mac:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Check the tag matches package.json
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          node - "$TAG" <<'NODE'
          const fs = require('node:fs')
          const tag = process.argv[2] ?? ''
          const semver =
            /^v(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-(?:(?:0|[1-9]\d*)|(?:[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))(?:\.(?:(?:0|[1-9]\d*)|(?:[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)))*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/
          if (!semver.test(tag)) {
            console.error(`Tag must be a v-prefixed SemVer release tag: ${tag}`)
            process.exit(1)
          }
          const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version
          if (tag !== `v${version}`) {
            console.error(`Tag ${tag} does not match package.json version ${version}`)
            process.exit(1)
          }
          NODE

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run dist:mac

      # macOS ships shasum, not GNU sha256sum, and a separate file keeps this
      # job from clobbering the AppImage job's SHA256SUMS.txt.
      - name: Checksum
        working-directory: release
        run: shasum -a 256 *.dmg *.zip > SHA256SUMS-mac.txt

      - name: Publish
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version_without_build=${TAG%%+*}
          release_args=()
          case "$version_without_build" in *-*) release_args+=(--prerelease) ;; esac
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes "${release_args[@]}" \
            || gh release view "$TAG" >/dev/null 2>&1
          gh release upload "$TAG" release/*.dmg release/*.zip release/SHA256SUMS-mac.txt --clobber

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run on any branch on demand: gh workflow run ci.yml --ref <branch>
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

  mac:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # node-pty is native, so the runner builds its own.
      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # The runner has a live GUI session, so the app window really draws and
      # capturePage() produces real pixels. Serial because a shared runner is
      # slow; four side-by-side app instances are tuned for the dev machine.
      - run: mkdir -p verify-shots
      - run: npm run verify:app -- --serial
        env:
          VITE_SHOT_DIR: ${{ github.workspace }}/verify-shots

      - run: npm run dist:mac

      # The screenshots matter most when something failed, so they upload either
      # way. The installers are hundreds of megabytes and are only ever looked at
      # right after the run, hence the short retention.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mac-verify-screenshots
          path: verify-shots/*.png

      - uses: actions/upload-artifact@v7
        with:
          name: mac-installers
          retention-days: 7
          path: |
            release/*.dmg
            release/*.zip
